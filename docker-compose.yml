version: '3.8'
services:
  spring-app:
    build: .
    ports:
      - "8080:8080"
        # user: "0:0" # Dies erzwingt Root-Rechte für den Schreibzugriff auf /data
      # 'nobody' ist ein Standard-User mit minimalen Rechten
    user: "65534:65534"
    volumes:
      - h2_data:/data
    restart: always
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

volumes:
  h2_data: