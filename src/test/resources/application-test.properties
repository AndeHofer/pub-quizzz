# In-memory H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Required env-var substitutions used by application.properties
ADMIN_USER=admin
ADMIN_PASSWORD=admin123
DEFAULT_USER=test
DEFAULT_PASSWORD=test123
# Suppress file-based log output in tests
logging.file.name=
# Use a temp dir for image uploads in tests
app.upload.dir=${java.io.tmpdir}
app.backup.restore-dir=${java.io.tmpdir}/pending-restore-test
