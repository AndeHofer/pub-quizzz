<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <title>Benutzer Registrieren - Admin Panel</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container small">
    <h1>Neuen Benutzer registrieren</h1>

    <div class="field-group">
        <label for="username">Benutzername:</label>
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="field-group">
        <label for="password">Passwort:</label>
        <input type="password" id="password" placeholder="Password">
    </div>
    <div class="field-group">
        <label for="role">Rolle:</label>
        <select id="role" name="role">
            <option value="ADMIN">ADMIN</option>
            <option value="USER">USER</option>
        </select>
    </div>

    <button onclick="registerUser()">Benutzer Registrieren</button>
    <button type="button" class="back-btn" onclick="goBack()">Zurück zum Admin Bereich</button>

    <div id="message" class="message"></div>
</div>

<script>
    function registerUser() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const messageDiv = document.getElementById('message');

        if (!username || !password || !role) {
            showMessage('Bitte füllen Sie alle Felder aus', 'error');
            return;
        }

        const userData = {
            username: username,
            password: password,
            role: role
        };

        fetch('/admin/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(userData)
        })
            .then(response => {
                if (response.ok) {
                    showMessage('Benutzer erfolgreich registriert!', 'success');
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('role').value = '';
                } else {
                    console.log(response);
                    showMessage('Registrierung fehlgeschlagen. Bitte versuchen Sie es erneut.', 'error');
                }
            })
            .catch(error => {
                showMessage('Fehler: ' + error, 'error');
                console.error('Error:', error);
            });
    }

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        messageDiv.style.display = 'block';
    }

    function goBack() {
        window.location.href = 'admin_main.html';
    }
</script>
</body>
</html>
