<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <title>Admin Bereich - Pub Quizzz</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>📊 Admin Bereich</h1>

    <div class="section">
        <h2>Quiz Verwaltung</h2>
        <div class="button-group">
            <button onclick="location.href='create_quiz.html'">➕ Neues Quiz anlegen</button>
            <button class="secondary-btn" onclick="viewQuizzes()">📋 Alle Quizze anzeigen</button>
            <button class="secondary-btn" onclick="editQuiz()">✏️ Quiz bearbeiten</button>
            <button class="danger-btn" onclick="deleteQuiz()">🗑️ Quiz löschen</button>
        </div>
    </div>

    <div class="section">
        <h2>Team Verwaltung</h2>
        <div class="button-group">
            <button onclick="createTeam()">➕ Neues Team anlegen</button>
            <button class="secondary-btn" onclick="viewTeams()">👥 Alle Teams anzeigen</button>
            <button class="danger-btn" onclick="deleteTeam()">🗑️ Team löschen</button>
        </div>
    </div>

    <div class="section">
        <h2>Ergebnisse & Auswertung</h2>
        <div class="button-group">
            <button onclick="viewResults()">📈 Ergebnisse anzeigen</button>
            <button class="secondary-btn" onclick="exportResults()">💾 Ergebnisse exportieren</button>
            <button onclick="viewLeaderboard()">🏆 Rangliste anzeigen</button>
        </div>
    </div>

    <div class="section">
        <h2>Benutzerverwaltung</h2>
        <div class="button-group">
            <button onclick="location.href='register_user.html'">➕ Neuen Admin User anlegen</button>
            <button class="secondary-btn" onclick="viewUsers()">👤 User anzeigen</button>
        </div>
    </div>

    <div class="button-group">
        <button class="back-btn" onclick="goBack()">← Zurück zur Hauptseite</button>
    </div>
</div>

<!-- Modal for displaying data -->
<div id="dataModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    const API_BASE = '/admin';

    function goBack() {
        window.location.href = '/index.html';
    }

    function closeModal() {
        document.getElementById('dataModal').style.display = 'none';
    }

    function showModal(title, content) {
        const modal = document.getElementById('dataModal');
        const modalContent = document.getElementById('modalContent');
        modalContent.innerHTML = `<h2>${title}</h2>${content}`;
        modal.style.display = 'block';
    }

    function showLoading() {
        return '<div class="loading">Laden...</div>';
    }

    function showError(message) {
        return `<div class="error">❌ ${message}</div>`;
    }

    function showSuccess(message) {
        return `<div class="success">✅ ${message}</div>`;
    }

    // ==================== Quiz Management ====================

    async function viewQuizzes() {
        showModal('Alle Quizze', showLoading());

        try {
            const response = await fetch(`${API_BASE}/quizzes`);
            const quizzes = await response.json();

            if (quizzes.length === 0) {
                showModal('Alle Quizze', '<p>Keine Quizze gefunden.</p>');
                return;
            }

            let html = '<table><thead><tr><th>ID</th><th>Veröffentlicht am</th><th>Abgabedatum</th><th>Fragen</th></tr></thead><tbody>';
            quizzes.forEach(quiz => {
                html += `<tr>
                    <td>${quiz.quizId}</td>
                    <td>${quiz.pubDate}</td>
                    <td>${quiz.submitDate}</td>
                    <td>${quiz.questionCount}</td>
                </tr>`;
            });
            html += '</tbody></table>';

            showModal('Alle Quizze', html);
        } catch (error) {
            showModal('Fehler', showError('Fehler beim Laden der Quizze: ' + error.message));
        }
    }

    async function editQuiz() {
        const quizId = prompt('Quiz ID eingeben:');
        if (!quizId) return;

        try {
            const response = await fetch(`${API_BASE}/quiz/${quizId}`);
            if (!response.ok) {
                alert('Quiz nicht gefunden');
                return;
            }

            const quiz = await response.json();
            const newPubDate = prompt('Neues Veröffentlichungsdatum (YYYY-MM-DD):', quiz.pubDate);
            const newSubmitDate = prompt('Neues Abgabedatum (YYYY-MM-DD):', quiz.submitDate);

            if (newPubDate && newSubmitDate) {
                const updateResponse = await fetch(`${API_BASE}/quiz/${quizId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pubDate: newPubDate,
                        submitDate: newSubmitDate
                    })
                });

                if (updateResponse.ok) {
                    alert('Quiz erfolgreich aktualisiert!');
                } else {
                    alert('Fehler beim Aktualisieren des Quiz');
                }
            }
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    async function deleteQuiz() {
        const quizId = prompt('Quiz ID zum Löschen eingeben:');
        if (!quizId) return;

        if (!confirm(`Quiz ${quizId} wirklich löschen? Dies kann nicht rückgängig gemacht werden!`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/quiz/${quizId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert('Quiz erfolgreich gelöscht!');
            } else {
                alert('Fehler beim Löschen des Quiz');
            }
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    // ==================== Team Management ====================

    async function createTeam() {
        const teamName = prompt('Team-Namen eingeben:');
        if (!teamName) return;

        try {
            const response = await fetch(`${API_BASE}/team?teamName=${encodeURIComponent(teamName)}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert('Team erfolgreich erstellt!');
            } else {
                const message = await response.text();
                alert('Fehler: ' + message);
            }
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    async function viewTeams() {
        showModal('Alle Teams', showLoading());

        try {
            const response = await fetch(`${API_BASE}/teams`);
            const teams = await response.json();

            if (teams.length === 0) {
                showModal('Alle Teams', '<p>Keine Teams gefunden.</p>');
                return;
            }

            let html = '<table><thead><tr><th>ID</th><th>Team-Name</th></tr></thead><tbody>';
            teams.forEach(team => {
                html += `<tr>
                    <td>${team.teamsId}</td>
                    <td>${team.teamName}</td>
                </tr>`;
            });
            html += '</tbody></table>';

            showModal('Alle Teams', html);
        } catch (error) {
            showModal('Fehler', showError('Fehler beim Laden der Teams: ' + error.message));
        }
    }

    async function deleteTeam() {
        const teamId = prompt('Team ID zum Löschen eingeben:');
        if (!teamId) return;

        if (!confirm(`Team ${teamId} wirklich löschen?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/team/${teamId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert('Team erfolgreich gelöscht!');
            } else {
                alert('Fehler beim Löschen des Teams');
            }
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    // ==================== Results Management ====================

    async function viewResults() {
        const quizId = prompt('Quiz ID für Ergebnisse eingeben (leer = alle):');

        showModal('Ergebnisse', showLoading());

        try {
            const url = quizId ? `${API_BASE}/results?quizId=${quizId}` : `${API_BASE}/results`;
            const response = await fetch(url);
            const results = await response.json();

            if (results.length === 0) {
                showModal('Ergebnisse', '<p>Keine Ergebnisse gefunden.</p>');
                return;
            }

            let html = '<table><thead><tr><th>Team</th><th>Quiz Datum</th>';
            for (let i = 1; i <= 8; i++) {
                html += `<th>Q${i}</th>`;
            }
            html += '<th>Gesamt</th></tr></thead><tbody>';

            results.forEach(result => {
                html += `<tr>
                    <td>${result.teamName}</td>
                    <td>${result.quizDate}</td>
                    <td>${result.answer1Points || 0}${result.changedAnswer1 ? '*' : ''}</td>
                    <td>${result.answer2Points || 0}${result.changedAnswer2 ? '*' : ''}</td>
                    <td>${result.answer3Points || 0}${result.changedAnswer3 ? '*' : ''}</td>
                    <td>${result.answer4Points || 0}${result.changedAnswer4 ? '*' : ''}</td>
                    <td>${result.answer5Points || 0}${result.changedAnswer5 ? '*' : ''}</td>
                    <td>${result.answer6Points || 0}${result.changedAnswer6 ? '*' : ''}</td>
                    <td>${result.answer7Points || 0}${result.changedAnswer7 ? '*' : ''}</td>
                    <td>${result.answer8Points || 0}${result.changedAnswer8 ? '*' : ''}</td>
                    <td><strong>${result.totalPoints}</strong></td>
                </tr>`;
            });
            html += '</tbody></table>';
            html += '<p style="margin-top: 10px; color: #666;"><em>* = Antwort wurde geändert</em></p>';

            showModal('Ergebnisse', html);
        } catch (error) {
            showModal('Fehler', showError('Fehler beim Laden der Ergebnisse: ' + error.message));
        }
    }

    async function exportResults() {
        const quizId = prompt('Quiz ID für Export eingeben (leer = alle):');

        try {
            const url = quizId ? `${API_BASE}/results/export?quizId=${quizId}` : `${API_BASE}/results/export`;
            window.open(url, '_blank');
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    async function viewLeaderboard() {
        const quizId = prompt('Quiz ID für Rangliste eingeben (leer = alle):');

        showModal('Rangliste', showLoading());

        try {
            const url = quizId ? `${API_BASE}/leaderboard?quizId=${quizId}` : `${API_BASE}/leaderboard`;
            const response = await fetch(url);
            const leaderboard = await response.json();

            if (leaderboard.length === 0) {
                showModal('Rangliste', '<p>Keine Ergebnisse gefunden.</p>');
                return;
            }

            let html = '<table><thead><tr><th>Rang</th><th>Team</th><th>Quiz Datum</th><th>Punkte</th></tr></thead><tbody>';
            leaderboard.forEach(entry => {
                const rankEmoji = entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : entry.rank;
                html += `<tr>
                    <td>${rankEmoji}</td>
                    <td>${entry.teamName}</td>
                    <td>${entry.quizDate}</td>
                    <td><strong>${entry.totalPoints}</strong></td>
                </tr>`;
            });
            html += '</tbody></table>';

            showModal('🏆 Rangliste', html);
        } catch (error) {
            showModal('Fehler', showError('Fehler beim Laden der Rangliste: ' + error.message));
        }
    }

    // ==================== User Management ====================

    async function viewUsers() {
        showModal('Alle Benutzer', showLoading());

        try {
            const response = await fetch(`${API_BASE}/users`);
            const users = await response.json();

            if (users.length === 0) {
                showModal('Alle Benutzer', '<p>Keine Benutzer gefunden.</p>');
                return;
            }

            let html = '<table><thead><tr><th>ID</th><th>Benutzername</th><th>Rolle</th></tr></thead><tbody>';
            users.forEach(user => {
                html += `<tr>
                    <td>${user.userId}</td>
                    <td>${user.username}</td>
                    <td>${user.role}</td>
                    <td style="width: 1%; white-space: nowrap; text-align: center;">
                        <button class="icon-btn" onclick="deleteUser(${user.userId}, '${user.username}')" title="Benutzer löschen">🗑️</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';

            showModal('Alle Benutzer', html);
        } catch (error) {
            showModal('Fehler', showError('Fehler beim Laden der Benutzer: ' + error.message));
        }
    }

    // Add deleteUser function
    async function deleteUser(userId, username) {
        // Confirmation question
        if (!confirm(`Sind Sie sicher, dass Sie den Benutzer "${username}" löschen möchten?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/user/${userId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                // Refresh the user list after successful deletion
                await viewUsers();
            } else {
                const errorText = await response.text();
                alert('Fehler beim Löschen: ' + errorText);
            }
        } catch (error) {
            alert('Fehler: ' + error.message);
        }
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('dataModal');
        if (event.target === modal) {
            closeModal();
        }
    }
</script>
</body>
</html>
