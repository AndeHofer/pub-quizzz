openapi: "3.0.3"
info:
  title: Team Results API
  version: "1.0"
paths:
  /api/teams/{teamName}/results:
    get:
      summary: Ergebnisse eines Teams über alle Quizze
      operationId: getTeamResults
      tags:
        - leaderboard
      parameters:
        - name: teamName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ergebnisse des Teams, neueste zuerst
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResultEntry'
        "401":
          description: Nicht authentifiziert
components:
  schemas:
    TeamResultEntry:
      type: object
      properties:
        quizDate:
          type: string
          format: date
          description: Datum des Quizzes (ISO 8601)
        quizTitle:
          type: string
          description: Titel des Quizzes (oder "YYYY Monatsname" als Fallback)
        totalPoints:
          type: integer
          description: Gesamtpunkte des Teams in diesem Quiz
        answers:
          type: array
          description: Punkte pro Frage (1-8)
          items:
            $ref: '#/components/schemas/AnswerScoreDTO'
    AnswerScoreDTO:
      type: object
      properties:
        questionNumber:
          type: integer
        points:
          type: integer
        changed:
          type: boolean
