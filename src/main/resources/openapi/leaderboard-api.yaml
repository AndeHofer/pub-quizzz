openapi: "3.0.3"
info:
  title: User Leaderboard API
  version: "1.0"
paths:
  /api/leaderboard:
    get:
      summary: Gesamtrangliste aller Teams
      operationId: getAllTimeLeaderboard
      tags:
        - leaderboard
      responses:
        "200":
          description: Sortierte Gesamtrangliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllTimeLeaderboardEntry'
        "401":
          description: Nicht authentifiziert
components:
  schemas:
    AllTimeLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          description: Rang (1-basiert)
        teamName:
          type: string
          description: Name des Teams
        totalPoints:
          type: integer
          description: Gesamtpunkte über alle Quizze
        quizCount:
          type: integer
          description: Anzahl gespielte Quizze
