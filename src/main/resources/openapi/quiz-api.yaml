openapi: "3.0.3"
info:
  title: Quiz API
  version: "1.0"
paths:
  /api/quizzes:
    get:
      summary: Liste aller Quizze mit Teamanzahl, neueste zuerst
      operationId: getQuizzes
      tags:
        - quizzes
      responses:
        "200":
          description: Liste der Quizze
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizSummaryDTO'
        "401":
          description: Nicht authentifiziert
  /api/quizzes/{quizId}/results:
    get:
      summary: Rangliste der Teams für ein Quiz, absteigend nach Punkten
      operationId: getQuizResults
      tags:
        - quizzes
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Teamrangliste für das Quiz
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizResultEntry'
        "401":
          description: Nicht authentifiziert
components:
  schemas:
    QuizSummaryDTO:
      type: object
      properties:
        quizId:
          type: integer
          format: int64
        quizTitle:
          type: string
          description: Titel des Quizzes (oder "YYYY Monatsname" als Fallback)
        pubDate:
          type: string
          format: date
        teamCount:
          type: integer
    QuizResultEntry:
      type: object
      properties:
        rank:
          type: integer
          description: Rang (Olympic-Stil, Gleichstand wird übersprungen)
        teamName:
          type: string
        totalPoints:
          type: integer
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerScoreDTO'
    AnswerScoreDTO:
      type: object
      properties:
        questionNumber:
          type: integer
        points:
          type: integer
        changed:
          type: boolean
