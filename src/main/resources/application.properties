spring.application.name=pub-quizzz
server.forward-headers-strategy=framework
server.servlet.session.timeout=4h
# database
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=true
spring.datasource.url=jdbc:h2:file:/data/pubquizzz;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# File upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.upload.dir=/data/uploads
app.backup.restore-dir=/data/pending-restore
app.backup.import.max-entries=5000
app.backup.import.max-entry-size-bytes=52428800
app.backup.import.max-total-uncompressed-size-bytes=524288000
# other
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.main.banner-mode=off
