<!DOCTYPE html>
<html lang="de-AT" style="background-color:var(--pq-page-bg,#f9fafb)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teams - Pub Quizzz</title>
    <script src="/public-theme-bootstrap.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-1 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">
    <div class="mb-6">
        <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Startseite</a>
    </div>
    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">Teams</h1>
    <div id="loading" class="text-center py-12 text-gray-500" role="status">Teams werden geladen...</div>
    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" role="alert"
         style="display:none;"></div>
    <div id="emptyState" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 text-center text-gray-500"
         style="display:none;">Noch keine teilnehmenden Teams vorhanden.
    </div>
    <ul id="teamsList" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
        style="display:none;"></ul>
</div>
<script type="module" src="./js/teams.ts"></script>
<script type="module" src="./js/public_theme_init.ts"></script>
</body>
</html>
