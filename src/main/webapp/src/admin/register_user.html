<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benutzer Registrieren - Admin Panel</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container small">
    <h1>Neuen Benutzer registrieren</h1>

    <div class="field-group">
        <label for="username">Benutzername:</label>
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="field-group">
        <label for="password">Passwort:</label>
        <input type="password" id="password" placeholder="Password">
    </div>
    <div class="field-group">
        <label for="role">Rolle:</label>
        <select id="role" name="role">
            <option value="ADMIN">ADMIN</option>
            <option value="USER">USER</option>
        </select>
    </div>

    <button id="registerUserBtn">Benutzer Registrieren</button>
    <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>

    <div id="message" class="message"></div>
</div>

<script type="module" src="/js/register_user.ts"></script>
<script type="module" src="/js/page-transition.ts"></script>
</body>
</html>
