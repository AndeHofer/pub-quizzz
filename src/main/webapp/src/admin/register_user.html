<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benutzer registrieren</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">
    <div class="mb-6">
        <a href="./admin_main.html" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Admin Bereich</a>
    </div>

    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">Neuen Benutzer registrieren</h1>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
        <div class="field-group">
            <label for="username">Benutzername:</label>
            <input type="text" id="username" placeholder="Benutzername">
        </div>

        <div class="field-group">
            <label for="password">Passwort:</label>
            <input type="password" id="password" placeholder="Passwort">
        </div>

        <div class="field-group mb-0">
            <label for="role">Rolle:</label>
            <select id="role" name="role">
                <option value="ADMIN">ADMIN</option>
                <option value="USER">USER</option>
            </select>
        </div>
    </div>

    <button id="registerUserBtn">Benutzer registrieren</button>
    <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>

    <div id="message" class="message"></div>
</div>

<script type="module" src="../js/register_user.ts"></script>
<script type="module" src="../js/page-transition.ts"></script>
</body>
</html>
