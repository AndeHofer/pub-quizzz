<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System-Log</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">
    <div class="mb-6">
        <a href="./admin_main.html" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Admin Bereich</a>
    </div>

    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">System-Log</h1>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
        <div class="result-meta-grid">
            <div class="field-group mb-0">
                <label for="logFilterText">Wortfilter:</label>
                <input id="logFilterText" type="text" placeholder="z. B. Fehler oder username">
            </div>
            <div class="field-group mb-0">
                <label for="logFilterLevel">Level:</label>
                <select id="logFilterLevel">
                    <option value="">Alle</option>
                    <option value="DEBUG">DEBUG</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                </select>
            </div>
            <div class="field-group mb-0">
                <label for="logFilterFrom">Zeitraum von:</label>
                <input id="logFilterFrom" type="datetime-local">
            </div>
            <div class="field-group mb-0">
                <label for="logFilterTo">Zeitraum bis:</label>
                <input id="logFilterTo" type="datetime-local">
            </div>
            <div class="field-group mb-0">
                <label for="logFilterLimit">Zeilenanzahl:</label>
                <select id="logFilterLimit">
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
        </div>
        <div class="button-group mt-4">
            <button type="button" id="applyFiltersBtn">Filter anwenden</button>
            <button type="button" id="resetFiltersBtn" class="secondary-btn">Zuruecksetzen</button>
        </div>
    </div>

    <div id="loading" class="text-center py-8 text-gray-500">Log-Eintraege werden geladen...</div>
    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>
    <div id="message" class="message"></div>

    <div id="logMeta" class="text-sm text-gray-600 mb-3" style="display:none;"></div>
    <div id="logStream" class="space-y-3" style="display:none;"></div>

    <button type="button" class="back-btn" id="backBtn">Zurueck zum Admin Bereich</button>
</div>

<script type="module" src="../js/admin_logs.ts"></script>
<script type="module" src="../js/page-transition.ts"></script>
</body>
</html>
