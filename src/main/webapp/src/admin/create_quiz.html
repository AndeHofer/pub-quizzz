<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neuer Quiz Eintrag</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>Neuer Quiz Eintrag</h1>

    <form id="quizForm">
        <div class="section">
            <h2>Generelle Info</h2>
            <div class="field-group">
                <label for="quizTitle">Titel (optional):</label>
                <input type="text" id="quizTitle" placeholder="z.B. 2026 Jänner">
            </div>
            <div class="field-group">
                <label for="pubDate">Pub Quiz Datum (optional):</label>
                <input type="date" id="pubDate">
            </div>
        </div>

        <div id="questionsContainer">
            <!-- We will generate inputs for 8 questions -->
        </div>

        <div id="message" class="message"></div>

        <button type="submit">Speichere Quiz</button>
        <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>
    </form>
</div>

<script type="module" src="/js/create_quiz.ts"></script>
</body>
</html>
