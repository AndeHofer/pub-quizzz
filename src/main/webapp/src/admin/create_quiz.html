<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neuer Quiz Eintrag</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>Neuer Quiz Eintrag</h1>

    <form id="quizForm">
        <div class="section">
            <h2>Generelle Info</h2>
            <div class="field-group">
                <label for="pubDate">Pub Quiz Datum (optional):</label>
                <input type="date" id="pubDate">
            </div>
        </div>

        <div id="questionsContainer">
            <!-- We will generate inputs for 8 questions -->
        </div>

        <div id="message" class="message"></div>

        <button type="submit">Speichere Quiz</button>
        <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>
    </form>

    <!-- Document section — only shown in edit mode (requires a saved quiz ID) -->
    <div id="documentsSection" class="section" style="display:none; margin-top:1.5rem;">
        <h2>Dokumente</h2>
        <p class="text-sm text-gray-500" style="margin-bottom:0.75rem;">Hier können Dokumente zum Quiz hochgeladen
            werden (z.B. Fragen-PDF, Notizen). Dateien beliebigen Typs erlaubt.</p>
        <div id="documentList" style="margin-bottom:1rem;"></div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
            <input type="file" id="documentFileInput" style="flex:1; min-width:0;">
            <button type="button" id="uploadDocumentBtn">Hochladen</button>
        </div>
        <div id="documentMessage" class="message" style="margin-top:0.5rem;"></div>
    </div>
</div>

<script type="module" src="/js/create_quiz.ts"></script>
</body>
</html>
