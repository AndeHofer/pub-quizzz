<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ergebnisse verwalten</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">
    <div class="mb-6">
        <a href="./admin_main.html" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Admin Bereich</a>
    </div>

    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">Ergebnisse anzeigen</h1>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
        <div class="result-meta-grid">
            <div class="field-group mb-0">
                <label for="resultFilterQuiz">Quiz filtern:</label>
                <select id="resultFilterQuiz">
                    <option value="">Alle Quizze</option>
                </select>
            </div>
            <div class="field-group mb-0">
                <label for="resultFilterTeam">Team filtern:</label>
                <select id="resultFilterTeam">
                    <option value="">Alle Teams</option>
                </select>
            </div>
        </div>
    </div>

    <div id="loading" class="text-center py-8 text-gray-500">Ergebnisse werden geladen...</div>
    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>
    <div id="message" class="message"></div>

    <div class="overflow-x-auto">
        <table id="resultsTable" class="w-full bg-white rounded-lg shadow-sm results-table-grouped"
               style="display:none;">
            <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-100">
                <th class="col-team">Team</th>
                <th class="col-date">Quiz Datum</th>
                <th class="col-actions">Aktionen</th>
                <th class="col-total">Gesamt</th>
            </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>
</div>

<script type="module" src="../js/admin_results.ts"></script>
<script type="module" src="../js/page-transition.ts"></script>
</body>
</html>
