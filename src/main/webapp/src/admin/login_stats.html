<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login-Statistik pro Monat</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">
    <div class="mb-6">
        <a href="./admin_main.html" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Admin Bereich</a>
    </div>

    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">Login-Statistik pro Monat</h1>

    <div id="loading" class="text-center py-8 text-gray-500">Login-Statistik wird geladen...</div>
    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>
    <div id="message" class="message"></div>

    <div class="overflow-x-auto">
        <table id="loginStatsTable" class="w-full bg-white rounded-lg shadow-sm" style="display:none;">
            <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-100">
                <th class="text-left px-4 py-3">Monat</th>
                <th class="text-left px-4 py-3">Rolle</th>
                <th class="text-right px-4 py-3">Anzahl Logins</th>
            </tr>
            </thead>
            <tbody id="loginStatsBody"></tbody>
        </table>
    </div>

    <button type="button" class="back-btn" id="backBtn">Zurück zum Admin Bereich</button>
</div>

<script type="module" src="../js/admin_login_stats.ts"></script>
<script type="module" src="../js/page-transition.ts"></script>
</body>
</html>
