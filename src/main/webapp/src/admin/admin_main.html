<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Bereich - Pub Quizzz</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <div class="mb-6">
        <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Startseite</a>
    </div>
    <h1>📊 Admin Bereich</h1>

    <div class="section">
        <h2>Quiz Verwaltung</h2>
        <div class="button-group">
            <button id="createQuizBtn">➕ Neues Quiz anlegen</button>
            <button class="secondary-btn" id="viewQuizzesBtn">📋 Quiz anzeigen</button>
            <!-- page-level edit/delete removed: use per-row Aktionen in the quiz list -->
        </div>
    </div>

    <div class="section">
        <h2>Team Verwaltung</h2>
        <div class="button-group">
            <button id="createTeamBtn">➕ Neues Team anlegen</button>
            <button class="secondary-btn" id="viewTeamsBtn">👥 Teams anzeigen</button>
            <!-- page-level team delete removed: use per-row Aktionen in the team list -->
        </div>
    </div>

    <div class="section">
        <h2>Ergebnisse & Auswertung</h2>
        <div class="button-group">
            <button id="addResultBtn">➕ Neues Ergebnis anlegen</button>
            <button class="secondary-btn" id="viewResultsBtn">📈 Ergebnisse anzeigen</button>
        </div>
    </div>

    <div class="section">
        <h2>Benutzerverwaltung</h2>
        <div class="button-group">
            <button id="createUserBtn">➕ Neuen User anlegen</button>
            <button class="secondary-btn" id="viewUsersBtn">👤 User anzeigen</button>
            <button class="secondary-btn" id="viewLoginStatsBtn">📅 Login-Statistik anzeigen</button>
        </div>
    </div>

    <div class="section">
        <h2>Datenbank-Backup</h2>
        <div class="button-group">
            <button id="exportBackupBtn">⬇ Backup exportieren</button>
            <button class="secondary-btn" id="importBackupBtn">⬆ Backup importieren</button>
        </div>
        <form id="importBackupForm" style="display:none; margin-top:0.75rem;">
            <input type="file" id="backupFileInput" accept=".zip" style="margin-bottom:0.5rem;"><br>
            <button type="submit">Backup hochladen</button>
        </form>
        <div id="backupMessage"></div>
    </div>

    <div class="section">
        <h2>Wartung</h2>
        <div class="button-group">
            <button class="secondary-btn" id="cleanupImagesBtn">🗑 Verwaiste Bilder löschen</button>
            <button class="secondary-btn" id="viewLogsBtn">📜 System-Log anzeigen</button>
        </div>
        <div id="cleanupMessage"></div>
    </div>
</div>

<!-- Modal for displaying data -->
<div id="dataModal" class="modal">
    <div class="modal-content">
        <span class="close" id="modalCloseBtn">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script type="module" src="/js/admin_functions.ts"></script>
<script type="module" src="/js/page-transition.ts"></script>
</body>
</html>
