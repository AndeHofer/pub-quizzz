<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <title>Admin Bereich - Pub Quizzz</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>📊 Admin Bereich</h1>

    <div class="section">
        <h2>Quiz Verwaltung</h2>
        <div class="button-group">
            <button onclick="location.href='create_quiz.html'">➕ Neues Quiz anlegen</button>
            <button class="secondary-btn" onclick="viewQuizzes()">📋 Quizze anzeigen</button>
            <!-- page-level edit/delete removed: use per-row Aktionen in the quiz list -->
        </div>
    </div>

    <div class="section">
        <h2>Team Verwaltung</h2>
        <div class="button-group">
            <button onclick="createTeam()">➕ Neues Team anlegen</button>
            <button class="secondary-btn" onclick="viewTeams()">👥 Teams anzeigen</button>
            <!-- page-level team delete removed: use per-row Aktionen in the team list -->
        </div>
    </div>

    <div class="section">
        <h2>Ergebnisse & Auswertung</h2>
        <div class="button-group">
            <button onclick="showAddResultModal()">➕ Ergebnis hinzufügen</button>
            <button class="secondary-btn" onclick="viewResults()">📈 Ergebnisse anzeigen</button>
        </div>
    </div>

    <div class="section">
        <h2>Benutzerverwaltung</h2>
        <div class="button-group">
            <button onclick="location.href='register_user.html'">➕ Neuen User anlegen</button>
            <button class="secondary-btn" onclick="viewUsers()">👤 User anzeigen</button>
        </div>
    </div>

    <div class="section">
        <h2>Datenbank-Backup</h2>
        <div class="button-group">
            <button id="exportBackupBtn">⬇ Backup exportieren</button>
            <button class="secondary-btn" id="importBackupBtn">⬆ Backup importieren</button>
        </div>
        <form id="importBackupForm" style="display:none; margin-top:0.75rem;">
            <input type="file" id="backupFileInput" accept=".zip" style="margin-bottom:0.5rem;"><br>
            <button type="submit">Backup hochladen</button>
        </form>
        <div id="backupMessage"></div>
    </div>

    <div class="button-group">
        <button class="back-btn" onclick="goBack()">← Zurück zur Hauptseite</button>
    </div>
</div>

<!-- Modal for displaying data -->
<div id="dataModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script type="module" src="/js/admin_functions.ts"></script>
</body>
</html>
