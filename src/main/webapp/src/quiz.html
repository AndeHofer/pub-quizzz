<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Ergebnis - Pub Quizzz</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">

    <div class="mb-6">
        <a href="/" class="text-gray-500 hover:text-gray-700 text-sm" id="topAnchor">&larr; Startseite</a>
    </div>

    <h1 id="quizHeading" class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">&#127942; Quiz Ergebnis</h1>

    <div id="loading" class="text-center py-12 text-gray-500">
        Ergebnisse werden geladen...
    </div>

    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>

    <div>
        <table id="resultsTable" class="w-full table-fixed bg-white rounded-lg shadow-sm"
               style="display:none;">
            <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-100">
                <th class="w-10 py-2 px-1.5 sm:w-16 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">
                    Rang
                </th>
                <th class="py-2 px-1.5 sm:py-3 sm:px-4 text-left text-gray-700 text-xs sm:text-base">Team</th>
                <th class="w-16 py-2 px-2 sm:w-24 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">
                    Punkte
                </th>
                <th class="w-10 py-2 px-1.5 sm:w-16 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base"></th>
            </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

</div>
<script type="module" src="./js/quiz.ts"></script>
<script type="module" src="./js/public_theme_init.ts"></script>
<script type="module" src="./js/page-transition.ts"></script>
</body>
</html>
