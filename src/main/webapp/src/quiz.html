<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Ergebnisse - Pub Quizzz</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">

    <div class="mb-6">
        <a href="/quizzes.html" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Quiz Archiv</a>
    </div>

    <h1 id="quizHeading" class="text-xl sm:text-3xl font-bold text-gray-800 mb-6 sm:mb-8">&#127942; Quiz Ergebnisse</h1>

    <div id="loading" class="text-center py-12 text-gray-500">
        Ergebnisse werden geladen...
    </div>

    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>

    <div class="overflow-x-auto">
        <table id="resultsTable" class="w-full bg-white rounded-lg shadow-sm min-w-[320px] sm:min-w-0"
               style="display:none;">
            <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-100">
                <th class="py-2 px-2 sm:py-3 sm:px-4 text-center text-gray-700 w-12 sm:w-16 text-xs sm:text-base">Rang</th>
                <th class="py-2 px-2 sm:py-3 sm:px-4 text-left text-gray-700 text-xs sm:text-base">Team</th>
                <th class="py-2 px-2 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">Punkte</th>
                <th class="py-2 px-2 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">Details</th>
            </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

</div>
<script type="module" src="./js/quiz.ts"></script>
</body>
</html>
