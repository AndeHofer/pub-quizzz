<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pub Quizzz</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-8 sm:py-12 max-w-full sm:max-w-2xl">

    <h1 class="text-2xl sm:text-4xl font-bold text-gray-800 mb-1 text-center">Pub Quizzz Archiv</h1>
    <p id="versionBadge" class="text-xs text-gray-400 text-center mb-4"></p>

    <div class="grid gap-3 sm:gap-4">

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden sm:grid sm:grid-cols-3">
            <a href="./points-leaderboard.html"
               class="block p-4 sm:p-5 hover:bg-gray-50 transition-colors min-h-[48px] sm:border-r sm:border-gray-200">
                <div class="font-semibold text-gray-800 text-base sm:text-lg">Punkte</div>
                <div class="text-gray-500 text-xs sm:text-sm">Rangliste nach Gesamtpunkten</div>
            </a>
            <a href="./medal-leaderboard.html"
               class="block p-4 sm:p-5 hover:bg-gray-50 transition-colors min-h-[48px] sm:border-r sm:border-gray-200">
                <div class="font-semibold text-gray-800 text-base sm:text-lg">Medaillen</div>
                <div class="text-gray-500 text-xs sm:text-sm">Olympische Medaillenwertung</div>
            </a>
            <a href="./average-leaderboard.html"
               class="block p-4 sm:p-5 hover:bg-gray-50 transition-colors min-h-[48px]">
                <div class="font-semibold text-gray-800 text-base sm:text-lg">Durchschnitt</div>
                <div class="text-gray-500 text-xs sm:text-sm">Rangliste nach Durchschnittspunkten</div>
            </a>
        </div>
        <a href="./quizzes.html"
           class="block bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 hover:shadow-md transition-shadow min-h-12">
            <div class="flex items-center gap-4">
                <div>
                    <div class="font-semibold text-gray-800 text-base sm:text-lg">Quiz Ergebnisse</div>
                    <div class="text-gray-500 text-xs sm:text-sm">Alle Quizze und Ergebnisse</div>
                </div>
            </div>
        </a>
        <a href="./quiz-details.html"
           class="block bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 hover:shadow-md transition-shadow min-h-12">
            <div class="flex items-center gap-4">
                <div>
                    <div class="font-semibold text-gray-800 text-base sm:text-lg">Quiz ansehen</div>
                    <div class="text-gray-500 text-xs sm:text-sm">Fragen, Hinweise und Antworten anzeigen</div>
                </div>
            </div>
        </a>
        <a id="adminCard" href="./admin/admin_main.html" style="display:none;"
           class="block bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 hover:shadow-md transition-shadow min-h-12">
            <div class="flex items-center gap-4">
                <div>
                    <div class="font-semibold text-gray-800 text-base sm:text-lg">Admin Panel</div>
                    <div class="text-gray-500 text-xs sm:text-sm">Quizze, Teams und Ergebnisse verwalten</div>
                </div>
            </div>
        </a>
    </div>
</div>
<script type="module" src="./js/index.ts"></script>
</body>
</html>
