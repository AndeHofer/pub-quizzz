<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Durchschnittsrangliste - Pub Quizzz</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-3 sm:px-4 py-6 sm:py-8 max-w-full sm:max-w-3xl">

    <div class="mb-6">
        <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Startseite</a>
    </div>

    <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-3 sm:mb-4">📊 Durchschnittsrangliste</h1>

    <div class="mb-2">
        <div id="leaderboardYearTabs" class="flex gap-2 overflow-x-auto pb-1"></div>
    </div>

    <div id="loading" class="text-center py-12 text-gray-500">
        Rangliste wird geladen...
    </div>

    <div id="errorMessage" class="bg-red-100 text-red-700 rounded-lg px-4 py-3 mb-4" style="display:none;"></div>

    <div>
        <table id="leaderboardTable" class="w-full table-fixed bg-white rounded-lg shadow-sm mt-0"
               style="display:none;">
            <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-100">
                <th class="w-10 py-2 px-1.5 sm:w-16 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">Rang
                </th>
                <th class="py-2 px-1.5 sm:py-3 sm:px-4 text-left text-gray-700 text-xs sm:text-base">Team</th>
                <th class="w-14 py-2 px-1.5 sm:w-36 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">
                    <span class="sm:hidden">Ø</span><span class="hidden sm:inline">Durchschnitt</span></th>
                <th class="w-12 py-2 px-1.5 sm:w-32 sm:py-3 sm:px-4 text-center text-gray-700 text-xs sm:text-base">
                    <span class="sm:hidden">Teiln.</span><span class="hidden sm:inline">Teilnahmen</span></th>
            </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

</div>

<script type="module" src="./js/average-leaderboard.ts"></script>
<script type="module" src="./js/public_theme_init.ts"></script>
<script type="module" src="./js/page-transition.ts"></script>
</body>
</html>
